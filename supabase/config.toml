project_id = "los-cursos-de-grimi"

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "https://cursos.alonsogrimaldo.com"
additional_redirect_urls = ["https://cursos.alonsogrimaldo.com/ingresar/", "https://los-cursos-de-grimi-one.vercel.app/ingresar/"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 12

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 8

[auth.sms]
enable_signup = false

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage.vector]
enabled = false
